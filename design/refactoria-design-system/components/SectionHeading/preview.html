<div class="stage">
  <div class="section-head_wrap">
    <div class="eyebrow_wrap"><span class="eyebrow_marker" aria-hidden="true"></span><p class="eyebrow_text">Open Source</p></div>
    <h2>Código abierto, con el proceso a la vista.</h2>
  </div>
  <div class="section-head_wrap centered">
    <div class="eyebrow_wrap"><span class="eyebrow_marker" aria-hidden="true"></span><p class="eyebrow_text">Contacto</p></div>
    <h2>Escribinos.</h2>
  </div>
</div>
<style>
  body{margin:0;background:var(--background);color:var(--text);font-family:var(--font-primary)}
  .stage{padding:24px;display:grid;gap:20px}
  .hint{margin:0;font-size:13px;color:var(--text-2)}
  :focus-visible{outline:var(--focus-width) solid var(--text);outline-offset:var(--focus-offset)}
  .eyebrow_wrap{display:inline-flex;align-items:center;gap:var(--space-2);font-family:var(--font-mono);font-size:14px;color:var(--text-2)}
  .eyebrow_wrap p,.eyebrow_wrap span.eyebrow_text{margin:0}
  .eyebrow_marker{flex:none;width:var(--border-width);height:.75rem;background:currentcolor}
  .eyebrow_wrap.tag{background:var(--text);color:var(--background);padding:var(--space-1) var(--space-2);border-radius:var(--radius-small)}
  .section-head_wrap{display:grid;gap:var(--space-3);justify-items:start;margin-bottom:var(--space-4);animation:reveal var(--duration-reveal) var(--ease-out-expo) both}
  .section-head_wrap+.section-head_wrap{animation-delay:var(--duration-stagger)}
  .section-head_wrap.centered{justify-items:center;text-align:center}
  .section-head_wrap h2{margin:0;font-size:clamp(32px,7vw,56px);font-weight:500;line-height:1;letter-spacing:-0.03em;text-wrap:balance}
  @keyframes reveal{from{opacity:0;filter:blur(var(--blur-reveal));transform:translateY(var(--reveal-offset))}}
  @media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation:none!important}*:hover,*:active{transform:none!important}}
</style>
